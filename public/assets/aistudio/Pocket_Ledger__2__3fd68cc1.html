<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one narrow column, phone-first. Month summary on top, tabbed views below, fixed bottom nav, bottom-sheet forms. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --fg:#14201c; --muted:#5b6962; --line:#dce2de;
  --accent:#1d4e89; --accent-fg:#ffffff; --chip:#e7ece9; --scrim:rgba(10,20,16,.45);
  --inc:#0c7a5a; --exp:#b8402b; --xfer:#566180;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1613; --surface:#17211d; --fg:#e6eee9; --muted:#8fa097; --line:#27342e;
    --accent:#86b4ee; --accent-fg:#0b1a2e; --chip:#202d27; --scrim:rgba(0,0,0,.6);
    --inc:#4cc79f; --exp:#f08a74; --xfer:#9aa6c4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1613; --surface:#17211d; --fg:#e6eee9; --muted:#8fa097; --line:#27342e;
  --accent:#86b4ee; --accent-fg:#0b1a2e; --chip:#202d27; --scrim:rgba(0,0,0,.6);
  --inc:#4cc79f; --exp:#f08a74; --xfer:#9aa6c4; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.45 var(--font-body);
  padding-block:8px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.inc{color:var(--inc)} .exp{color:var(--exp)} .xfer{color:var(--xfer)}
.muted{color:var(--muted)}
.lbl{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* header */
.head{padding:8px 0 4px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav h1{margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.icon{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.sum{margin-top:12px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.big{display:block;font-size:30px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.sum-split{display:flex;gap:24px}
.sum-split .mono{display:block;font-size:16px;font-weight:500;margin-top:2px}

/* ledger */
.day{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;min-height:56px}
.row:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.row-main{min-width:0;display:flex;flex-direction:column}
.row-title{font-weight:500}
.row-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}

/* stats */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{border:1px solid transparent;background:none;border-radius:8px;padding:9px 6px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);font-weight:600}
.section-t{margin:24px 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cat{margin:12px 0}
.cat-top{display:flex;justify-content:space-between;gap:12px}
.track{height:8px;background:var(--chip);border-radius:4px;margin-top:6px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;border-bottom:1px solid var(--line);padding-bottom:0}
.tcol{display:flex;flex-direction:column;align-items:center;min-width:0}
.bars{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.b{display:block;width:40%;max-width:20px;border-radius:3px 3px 0 0}
.b.i{background:var(--inc)} .b.e{background:var(--exp)}
.tm{font-size:12px;color:var(--muted);margin-top:6px}
.tm.now{color:var(--fg);font-weight:600}
.tn{font-size:11px;color:var(--muted);margin-bottom:8px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* accounts / more */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.card .row:last-child{border-bottom:0}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 4px}
.hint{font-size:13px;color:var(--muted);margin:8px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--exp);border-color:var(--exp)}
.btn.small{min-height:40px;padding:0 14px}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}
.inline{display:flex;gap:8px;margin:8px 0}
.inline input{flex:1;min-width:0}
.state{padding:48px 0;text-align:center}
.state-t{font-size:17px;font-weight:600;margin:0 0 6px}
.banner{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13px}

/* forms */
.field{margin:14px 0}
.flabel{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,select{width:100%;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.amtbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding-left:12px}
.amtbox input{border:0;background:none;font-family:var(--font-num);font-size:22px;font-weight:500;min-height:52px;padding-left:0}
.amtbox:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.amtbox input:focus-visible{outline:none}
.cur{color:var(--muted);font-family:var(--font-num)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip.dashed{border-style:dashed;color:var(--muted)}
.err{color:var(--exp);font-size:14px;margin:8px 0 0}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.panel{position:fixed;z-index:21;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel-h h2{margin:0;font-size:17px}
.actions{display:flex;gap:8px;margin-top:20px}
.actions .primary{flex:1}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{border:0;background:none;border-radius:8px;min-height:48px;color:var(--muted);font-size:13px;font-weight:500}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--chip)}
.fabwrap{position:fixed;left:0;right:0;z-index:6;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.fabwrap-in{max-width:560px;margin:0 auto;display:flex;justify-content:flex-end}
.fab{pointer-events:auto;min-height:52px;padding:0 22px;border-radius:26px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){
  .fill,.b{transition:height .25s ease,width .25s ease}
}
</style>

<div class="wrap" id="app"></div>

<div class="fabwrap"><div class="fabwrap-in"><button class="fab" id="fab" data-act="add" aria-label="Add entry">+ Add entry</button></div></div>

<nav class="nav" aria-label="Sections"><div class="nav-in">
  <button data-act="tab" data-v="ledger">Ledger</button>
  <button data-act="tab" data-v="stats">Stats</button>
  <button data-act="tab" data-v="accounts">Accounts</button>

<div id="sheet" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const monthOf = ds => ds.slice(0, 7);
const shiftMonth = (m, n) => { const p = m.split('-').map(Number); const d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const monthLabel = m => { const p = m.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); };
const monthShort = m => { const p = m.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-GB', { month: 'short' }); };
const dayLabel = ds => { const p = ds.split('-').map(Number); const s = new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); return ds === todayStr() ? 'Today, ' + s : s; };
const c100 = n => Math.round(Number(n) * 100);
const nf = new Intl.NumberFormat('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const newId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const LS_KEY = 'pocket-ledger-v1', LS_ACC = 'pocket-ledger-lastacc';

const OTHER_NAMES = ['Ewallet', 'Pbe Master', 'Pbe Visa', 'Pbe', 'Maybank', 'Uob', 'Gxbank', 'HL', 'Cash', 'Rebalance', 'Borrow', 'Modified Bal.'];
function catDefaults() {
  return {
    expense: ['F&B', 'Grocery and household', 'Transport', 'Bill', 'Education', 'Sports', 'Beauty', 'Health', 'Apparel', 'Social Life', 'Gift', 'Petty cash', 'FD/Saving', 'Other'].concat(OTHER_NAMES),
    income: ['Salary', 'Bonus', 'Allowance', 'Interest', 'Gift', 'Other'].concat(OTHER_NAMES)
  };
}
const ACC_NAMES = ['Pbe Master', 'Ewallet', 'Maybank', 'Pbe Visa', 'Uob', 'Gxbank', 'Pbe', 'HL', 'Cash', 'Accounts'];
const normName = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
function accDefaults() { return ACC_NAMES.map(n => ({ id: normName(n), name: n, opening: 0 })); }
let lastMigrated = false;
function defaults() {
  return {
    currency: 'RM',
    seed: 2,
    accSeed: 1,
    accounts: accDefaults(),
    cats: catDefaults()
  };
}
function mergeSettings(s) {
  const d = defaults();
  lastMigrated = false;
  if (!s || typeof s !== 'object') return d;
  const accs = Array.isArray(s.accounts) ? s.accounts.filter(a => a && a.id && a.name).map(a => ({ id: String(a.id), name: String(a.name), opening: Number(a.opening) || 0 })) : [];
  const list = (v, fb) => Array.isArray(v) && v.length ? v.map(String) : fb;
  const out = {
    currency: typeof s.currency === 'string' && s.currency.trim() ? s.currency.trim().slice(0, 6) : d.currency,
    seed: 2,
    accSeed: 1,
    accounts: accs.length ? accs : d.accounts,
    cats: { expense: list(s.cats && s.cats.expense, d.cats.expense), income: list(s.cats && s.cats.income, d.cats.income) }
  };
  if (s.seed !== 2) {
    // one-time: add the new default categories to an existing list, keeping everything already there
    ['expense', 'income'].forEach(t => d.cats[t].forEach(c => {
      if (!out.cats[t].some(x => x.toLowerCase() === c.toLowerCase())) out.cats[t].push(c);
    }));
    lastMigrated = true;
  }
  if (s.accSeed !== 1) {
    // one-time: add the default accounts that are not there yet (matched by name, ignoring case and punctuation)
    d.accounts.forEach(x => { if (!out.accounts.some(y => normName(y.name) === normName(x.name))) out.accounts.push({ id: x.id, name: x.name, opening: 0 }); });
    lastMigrated = true;
  }
  return out;
}

/* ---------- state ---------- */
const S = { settings: defaults(), tx: [], month: todayStr().slice(0, 7), tab: 'ledger', stat: 'expense', ready: false, slow: false, err: '', confirm: '' };
const P = { mode: 'pending', profile: null, txc: null };
let D = null;   // transaction draft
let A = null;   // account draft
let lastFocus = null;

/* ---------- persistence ---------- */
function localLoad() {
  try {
    const o = JSON.parse(lsGet(LS_KEY) || 'null');
    if (o) { S.settings = mergeSettings(o.settings); S.tx = Array.isArray(o.tx) ? o.tx : []; if (lastMigrated) localSave(); }
  } catch (e) {}
}
function localSave() { lsSet(LS_KEY, JSON.stringify({ settings: S.settings, tx: S.tx })); }

async function saveSettings() {
  if (P.mode === 'cloud') await P.profile.set(JSON.parse(JSON.stringify(S.settings)));
  else { localSave(); render(); }
}
async function saveTx(t) {
  if (P.mode === 'cloud') {
    const body = Object.assign({}, t); delete body.id;
    await P.txc.doc(t.id).set(body);
  } else {
    const i = S.tx.findIndex(x => x.id === t.id);
    if (i >= 0) S.tx[i] = t; else S.tx.push(t);
    localSave(); render();
  }
}
async function removeTx(id) {
  if (P.mode === 'cloud') await P.txc.doc(id).delete();
  else { S.tx = S.tx.filter(x => x.id !== id); localSave(); render(); }
}
async function inChunks(items, fn, size) {
  size = size || 8;
  for (let i = 0; i < items.length; i += size) await Promise.all(items.slice(i, i + size).map(fn));
}
async function guard(fn) {
  try { return await fn(); }
  catch (e) { toast('Could not save' + (e && e.code ? ' (' + e.code + ')' : '') + '. Try again.'); return undefined; }
}

async function init() {
  render();
  let db = null, user = null, uid = null;
  try {
    if (window.claude && window.claude.use) {
      db = await window.claude.use('db');
      user = await window.claude.use('user');
      if (user) uid = await user.id();
    }
  } catch (e) {}
  if (db && uid) {
    P.mode = 'cloud';
    P.profile = db.doc('data/users/' + uid + '/profile');
    P.txc = P.profile.collection('tx');
    let pOk = false, tOk = false;
    const timer = setTimeout(() => { if (!(pOk && tOk)) { S.slow = true; render(); } }, 10000);
    const check = () => { if (pOk && tOk) { clearTimeout(timer); S.slow = false; } };
    const onErr = e => {
      S.err = e && e.code === 'revoked' ? 'Access to your saved data was withdrawn. Reload to try again.' : 'Could not read your saved data (' + (e && e.code) + ').';
      render();
    };
    let migrationSaved = false;
    P.profile.onSnapshot(snap => {
      S.settings = snap.exists ? mergeSettings(snap.data()) : defaults();
      if (snap.exists && lastMigrated && !migrationSaved) { migrationSaved = true; guard(() => P.profile.set(JSON.parse(JSON.stringify(S.settings)))); }
      if (!snap.metadata.fromCache) { pOk = true; check(); }
      render();
    }, onErr);
    P.txc.onSnapshot(snap => {
      S.tx = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      S.ready = true;
      if (!snap.metadata.fromCache) { tOk = true; check(); }
      render();
    }, onErr);
  } else {
    P.mode = 'local';
    localLoad();
    S.ready = true;
    render();
  }
}

/* ---------- calculations ---------- */
const accName = id => { const a = S.settings.accounts.find(x => x.id === id); return a ? a.name : 'Unknown account'; };
const monthTx = m => S.tx.filter(t => t.date && t.date.slice(0, 7) === m);
const cmp = (a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0);
function totals(list) {
  let i = 0, e = 0;
  list.forEach(t => { if (t.type === 'income') i += c100(t.amount); else if (t.type === 'expense') e += c100(t.amount); });
  return { i: i, e: e };
}
function balances() {
  const b = {};
  S.settings.accounts.forEach(a => { b[a.id] = c100(a.opening); });
  S.tx.forEach(t => {
    const c = c100(t.amount);
    if (t.type === 'income' && b[t.acc] !== undefined) b[t.acc] += c;
    else if (t.type === 'expense' && b[t.acc] !== undefined) b[t.acc] -= c;
    else if (t.type === 'transfer') { if (b[t.acc] !== undefined) b[t.acc] -= c; if (b[t.to] !== undefined) b[t.to] += c; }
  });
  return b;
}
const fmt = c => (c < 0 ? '-' : '') + S.settings.currency + ' ' + nf.format(Math.abs(c) / 100);
const compact = c => { const v = Math.abs(c) / 100; return (c < 0 ? '-' : '') + (v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : String(Math.round(v))); };

/* ---------- views ---------- */
function banner() {
  let h = '';
  if (S.err) h += '<div class="banner" role="alert">' + esc(S.err) + '</div>';
  else if (S.slow) h += '<div class="banner">Your saved data cannot be reached yet. What you see may be out of date.</div>';
  return h;
}
function head() {
  const m = S.month, t = totals(monthTx(m)), net = t.i - t.e;
  return '<header class="head">' +
    '<div class="mnav"><button class="icon" data-act="prevm" aria-label="Previous month">&#8249;</button><h1>' + esc(monthLabel(m)) + '</h1><button class="icon" data-act="nextm" aria-label="Next month">&#8250;</button></div>' +
    '<div class="sum"><div><span class="lbl">Net this month</span><span class="big mono' + (net < 0 ? ' exp' : '') + '">' + fmt(net) + '</span></div>' +
    '<div class="sum-split"><div><span class="lbl">Income</span><span class="mono inc">' + fmt(t.i) + '</span></div><div><span class="lbl">Expense</span><span class="mono exp">' + fmt(t.e) + '</span></div></div></div></header>';
}
function rowHtml(t) {
  const c = c100(t.amount);
  let title, sub, amt;
  if (t.type === 'transfer') {
    title = 'Transfer'; sub = [accName(t.acc) + ' → ' + accName(t.to), t.note].filter(Boolean).join(' · ');
    amt = '<span class="amt xfer">' + fmt(c) + '</span>';

  const s = String(v == null ? '' : v).trim(); let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return validDate(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))) { let y = +m[3]; if (y < 100) y += 2000; return validDate(y, m[2], m[1]); }
  return null;
}
function showImportResult(added, skipped) {
  showSheet('<div class="scrim" data-act="closesheet"></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-t">' +
    '<div class="panel-h"><h2 id="sh-t">Upload finished</h2><button class="icon" data-act="closesheet" aria-label="Close">&times;</button></div>' +
    '<p><strong>' + added + '</strong> ' + (added === 1 ? 'entry' : 'entries') + ' added or updated' + (skipped.length ? ', <strong>' + skipped.length + '</strong> skipped.' : '.') + '</p>' +
    (skipped.length ? '<p class="hint">Skipped rows (first ' + Math.min(skipped.length, 8) + '):</p><ul class="hint">' + skipped.slice(0, 8).map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>' : '') +
    '<div class="actions"><button type="button" class="btn primary" data-act="closesheet">Done</button></div></div>');
}
async function importXlsx(file) {
  const X = xl(); if (!X) return;
  let wb;
  try { wb = X.read(await file.arrayBuffer(), { type: 'array' }); } catch (e) { toast('That file could not be read as an Excel file.'); return; }
  const sn = wb.SheetNames.find(n => n.toLowerCase() === 'entries') || wb.SheetNames[0];
  const aoa = X.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
  let hi = -1;
  for (let i = 0; i < Math.min(aoa.length, 10); i++) { const k = aoa[i].map(normKey); if (k.indexOf('date') >= 0 && k.indexOf('amount') >= 0) { hi = i; break; } }
  if (hi < 0) { toast('No header row with Date and Amount columns was found. Use the template.'); return; }
  const alias = { date: 'date', type: 'type', category: 'cat', cat: 'cat', account: 'acc', from: 'acc', fromaccount: 'acc', toaccount: 'to', to: 'to', amount: 'amount', note: 'note', notes: 'note', description: 'note', memo: 'note', id: 'id' };
  const col = {};
  aoa[hi].forEach((h, i) => { const f = alias[normKey(h)]; if (f && col[f] === undefined) col[f] = i; });
  const settings = JSON.parse(JSON.stringify(S.settings));
  let changed = false, seq = 0;
  const ensureAcc = name => {
    const n = String(name).trim(); const f = settings.accounts.find(a => a.name.toLowerCase() === n.toLowerCase());
    if (f) return f;
    const a = { id: 'a' + Date.now().toString(36) + (seq++), name: n.slice(0, 30), opening: 0 }; settings.accounts.push(a); changed = true; return a;
  };
  if (!settings.accounts.length) settings.accounts = defaults().accounts;
  const wsA = wb.SheetNames.find(n => n.toLowerCase() === 'accounts');
  if (wsA) {
    X.utils.sheet_to_json(wb.Sheets[wsA], { header: 1, raw: true, defval: '' }).slice(1).forEach(r => {
      if (!String(r[0]).trim()) return;
      const a = ensureAcc(r[0]); const o = typeof r[1] === 'number' ? r[1] : parseFloat(String(r[1]).replace(/[^0-9.\-]/g, ''));
      if (isFinite(o) && o !== a.opening) { a.opening = o; changed = true; }
    });
  }
  const list = [], skipped = [];
  for (let i = hi + 1; i < aoa.length; i++) {
    const r = aoa[i], line = i + 1;
    const cell = k => (col[k] === undefined ? '' : r[col[k]]);
    if (r.every(c => String(c).trim() === '')) continue;
    const type = String(cell('type')).trim().toLowerCase();
    if (['expense', 'income', 'transfer'].indexOf(type) < 0) { skipped.push('Row ' + line + ': type must be Expense, Income or Transfer'); continue; }
    const date = parseDate(cell('date'));
    if (!date) { skipped.push('Row ' + line + ': date not recognised'); continue; }
    const av = cell('amount'); const amount = Math.round((typeof av === 'number' ? av : parseFloat(String(av).replace(/[^0-9.\-]/g, ''))) * 100) / 100;
    if (!(amount > 0)) { skipped.push('Row ' + line + ': amount must be a positive number'); continue; }
    if (!String(cell('acc')).trim()) { skipped.push('Row ' + line + ': account is empty'); continue; }
    let to = '';
    if (type === 'transfer') {
      if (!String(cell('to')).trim()) { skipped.push('Row ' + line + ': transfer needs a To account'); continue; }
      if (String(cell('to')).trim().toLowerCase() === String(cell('acc')).trim().toLowerCase()) { skipped.push('Row ' + line + ': From and To accounts are the same'); continue; }
    }
    const acc = ensureAcc(cell('acc'));
    if (type === 'transfer') to = ensureAcc(cell('to')).id;
    let cat = '';
    if (type !== 'transfer') {
      cat = String(cell('cat')).trim().slice(0, 24) || 'Other';
      const cl = settings.cats[type]; const f = cl.find(c => c.toLowerCase() === cat.toLowerCase());
      if (f) cat = f; else { cl.push(cat); changed = true; }
    }
    const id = /^[A-Za-z0-9_-]{1,60}$/.test(String(cell('id'))) ? String(cell('id')) : newId();
    list.push({ id: id, type: type, date: date, amount: amount, cat: cat, acc: acc.id, to: to, note: String(cell('note')).trim().slice(0, 120), ts: Date.now() + list.length });
  }
  if (!list.length && !changed) { showImportResult(0, skipped.length ? skipped : ['No entries found in the file.']); return; }
  const ok = await guard(async () => {
    if (changed) { S.settings = settings; await saveSettings(); }
    if (P.mode === 'cloud') await inChunks(list, t => saveTx(t));
    else { list.forEach(t => { const j = S.tx.findIndex(x => x.id === t.id); if (j >= 0) S.tx[j] = t; else S.tx.push(t); }); localSave(); }
    return true;
  });
  if (!ok) return;
  if (list.length) { S.month = monthOf(list.slice().sort(cmp)[0].date); S.tab = 'ledger'; }
  render(); showImportResult(list.length, skipped);
}

function cleanTx(t) {
  if (!t || typeof t !== 'object') return null;
  const type = t.type; const amount = Math.round(Number(t.amount) * 100) / 100;
  if (['expense', 'income', 'transfer'].indexOf(type) < 0 || !(amount > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(String(t.date))) return null;
  return { id: /^[A-Za-z0-9_-]{1,60}$/.test(String(t.id)) ? String(t.id) : newId(), type: type, date: String(t.date), amount: amount, cat: String(t.cat || ''), acc: String(t.acc || ''), to: String(t.to || ''), note: String(t.note || '').slice(0, 120), ts: Number(t.ts) || Date.now() };
}
async function importJson(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { toast('That file is not a valid backup.'); return; }
  const list = (Array.isArray(obj.tx) ? obj.tx : []).map(cleanTx).filter(Boolean);
  if (!list.length && !obj.settings) { toast('No entries found in that file.'); return; }
  await guard(async () => {
    if (obj.settings) { S.settings = mergeSettings(obj.settings); await saveSettings(); }
    if (P.mode === 'cloud') await inChunks(list, t => saveTx(t));
    else { list.forEach(t => { const i = S.tx.findIndex(x => x.id === t.id); if (i >= 0) S.tx[i] = t; else S.tx.push(t); }); localSave(); }
    render(); toast('Restored ' + list.length + ' entries');
  });
}
async function loadSample() {
  const now = new Date(), td = now.getDate(), items = [];
  const findAcc = (...names) => { for (const n of names) { const a = S.settings.accounts.find(x => normName(x.name) === n); if (a) return a.id; } return S.settings.accounts[0].id; };
  const B = findAcc('maybank', 'bank'), W = findAcc('ewallet'), C = findAcc('cash');
  const add = (off, day, type, cat, acc, amount, note, to) => {
    const m = shiftMonth(todayStr().slice(0, 7), off);
    const dim = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0).getDate();
    let d = Math.min(day, dim); if (off === 0) d = Math.min(d, td);
    items.push({ id: newId(), type: type, date: m + '-' + pad(d), amount: amount, cat: cat, acc: acc, to: to || '', note: note, ts: Date.now() + items.length });
  };
  [-1, 0].forEach(o => {
    add(o, 1, 'income', 'Salary', B, 4800, 'Monthly salary');
    add(o, 2, 'expense', 'Bill', B, 1200, 'Room rent');
    add(o, 3, 'transfer', '', B, 300, 'Top up e-wallet', W);
    add(o, 4, 'expense', 'F&B', W, 14.5, 'Lunch');
    add(o, 6, 'expense', 'Transport', W, 22, 'Fuel');
    add(o, 8, 'expense', 'Bill', B, 98.9, 'Internet');
    add(o, 10, 'expense', 'F&B', C, 9.8, 'Breakfast');
    add(o, 12, 'expense', 'Apparel', W, 76, 'Shoes');
    add(o, 14, 'income', 'Bonus', C, 250, 'Freelance job');
    add(o, 16, 'expense', 'F&B', W, 38.2, 'Dinner out');
  });
  await guard(async () => {
    if (P.mode === 'cloud') await inChunks(items, t => saveTx(t));
    else { S.tx = S.tx.concat(items); localSave(); }
    S.tab = 'ledger'; render(); toast('Added ' + items.length + ' sample entries');
  });
}
async function clearAll() {
  if (S.confirm !== 'clear') { S.confirm = 'clear'; render(); return; }
  S.confirm = '';
  const ids = S.tx.map(t => t.id);
  await guard(async () => {
    if (P.mode === 'cloud') await inChunks(ids, id => removeTx(id));
    else { S.tx = []; localSave(); }
    render(); toast('All entries deleted');
  });
}
async function addCategory(type, name) {
  name = (name || '').trim();
  if (!name) return false;
  const list = S.settings.cats[type];
  if (list.some(c => c.toLowerCase() === name.toLowerCase())) return name;
  list.push(name);
  const ok = await guard(async () => { await saveSettings(); return true; });
  return ok ? name : false;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (act !== 'clearall' && S.confirm) S.confirm = '';
  switch (act) {
    case 'tab': S.tab = v; S.confirm = ''; render(); window.scrollTo(0, 0); break;
    case 'prevm': S.month = shiftMonth(S.month, -1); render(); break;
    case 'nextm': S.month = shiftMonth(S.month, 1); render(); break;
    case 'stat': S.stat = v; render(); break;
    case 'add': openTx(null); break;
    case 'edit': openTx(id); break;
    case 'closesheet': closeSheet(); break;
    case 'settype':
      syncDraft(); D.type = v; D.err = ''; D.addingCat = false;
      if (v !== 'transfer' && S.settings.cats[v].indexOf(D.cat) < 0) D.cat = S.settings.cats[v][0];
      sheet.innerHTML = txSheetHtml(); break;
    case 'pickcat': syncDraft(); D.cat = v; sheet.innerHTML = txSheetHtml(); break;
    case 'newcat': syncDraft(); D.addingCat = true; sheet.innerHTML = txSheetHtml(); { const f = $('#f-newcat'); if (f) f.focus(); } break;
    case 'savecat': {
      syncDraft();
      const n = await addCategory(D.type, ($('#f-newcat') || {}).value);
      if (n) D.cat = n;
      D.addingCat = false; sheet.innerHTML = txSheetHtml(); break;
    }
    case 'deltx':
      if (!D.confirmDel) { syncDraft(); D.confirmDel = true; sheet.innerHTML = txSheetHtml(); break; }
      { const rid = D.id; const ok = await guard(async () => { await removeTx(rid); return true; }); if (ok) { closeSheet(); render(); toast('Entry deleted'); } }
      break;
    case 'editacc': openAcc(id); break;
    case 'addacc': openAcc(null); break;
    case 'delacc':
      if (!A.confirmDel) { A.name = $('#a-name').value; A.opening = $('#a-open').value; A.confirmDel = true; sheet.innerHTML = accSheetHtml(); break; }
      S.settings.accounts = S.settings.accounts.filter(a => a.id !== A.id);
      if (await guard(async () => { await saveSettings(); return true; })) { closeSheet(); render(); toast('Account deleted'); }
      break;
    case 'rmcat': {
      const list = S.settings.cats[el.dataset.type];
      if (list.length > 1) { S.settings.cats[el.dataset.type] = list.filter(c => c !== v); await guard(saveSettings); render(); }
      else toast('Keep at least one category.');
      break;
    }
    case 'addcatmore': {
      const inp = $('#newcat-' + el.dataset.type);
      if (await addCategory(el.dataset.type, inp && inp.value)) render();
      break;
    }
    case 'exportxlsx': exportXlsx(); break;
    case 'template': downloadTemplate(); break;
    case 'importx': $('#impx').click(); break;
    case 'exportcsv': exportCsv(); break;
    case 'exportjson': exportJson(); break;
    case 'importbtn': $('#imp').click(); break;
    case 'sample': loadSample(); break;
    case 'clearall': clearAll(); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'txform') submitTx();
  else if (e.target.id === 'accform') submitAcc();
});
document.addEventListener('change', async e => {
  if (e.target.id === 'cur') {
    const v = e.target.value.trim().slice(0, 6);
    if (v) { S.settings.currency = v; await guard(saveSettings); render(); }
  } else if (e.target.id === 'impx') {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (f) importXlsx(f);
  } else if (e.target.id === 'imp') {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (f) importJson(f);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id && e.target.id.indexOf('newcat-') === 0) {
    e.preventDefault(); const b = e.target.parentElement.querySelector('[data-act="addcatmore"]'); if (b) b.click();
  }
  if (e.key === 'Enter' && e.target.id === 'f-newcat') { e.preventDefault(); const b = $('[data-act="savecat"]'); if (b) b.click(); }
});

init();
})();
</script>
